# ============================================================================
# GitHub Webhook Listener 配置文件
# ============================================================================
# 使用方法：
#   1. 复制此文件为 config.yaml（项目根目录）
#   2. 根据下方示例修改你的仓库配置
#   3. 启动服务：make run  或  go run ./cmd/webhook-listener -config config.yaml
#
# GitHub Webhook 设置：
#   在你的 GitHub 仓库 → Settings → Webhooks → Add webhook：
#   - Payload URL:  https://你的服务器IP:端口/webhook
#   - Content type: application/json
#   - Secret:       与此配置文件中的 secret 字段一致
#   - Events:       选择你需要的事件（push、pull_request 等）
# ============================================================================

repos:
  # =========================================================================
  # repos 是一个字典（map），每个键是 GitHub 仓库的全名（owner/repo 格式）。
  #
  # 这个键有两个作用：
  #   1) 用于匹配 GitHub Webhook 请求中的 repository.full_name
  #   2) 作为项目的唯一标识符（ID）
  #
  # 字段说明：
  #   name        在 Web 仪表盘上展示的项目名称（可选，不填则显示仓库全名）
  #   secret      GitHub Webhook Secret，用于 HMAC-SHA256 签名验证（必填）
  #   rules       触发规则列表（必填，至少一条）
  #   healthcheck 健康监控配置（可选，不配置则不监控该项目）
  # =========================================================================

  # -------------------------------------------------------------------------
  # 示例 1：自动部署 —— push 到 main 分支后执行部署脚本
  # -------------------------------------------------------------------------
  "zxc7563598/my-project":
    name: "我的项目"              # 前端仪表盘展示的名称
    secret: "your-secret-here"    # 必须与 GitHub Webhook 设置中的 Secret 一致
    rules:
      - event: "push"             # GitHub 事件类型，例如 push、pull_request、release
        branches:                 # 匹配的分支列表
          - main
          - master
        actions:                  # 匹配成功后执行的操作
          - type: "shell"         # 操作类型，目前固定为 shell
            command: |            # 要执行的 Shell 命令（支持多行文本）
              cd /opt/my-project
              git pull origin main
              docker-compose up -d --build
            timeout: 300          # 命令超时时间，单位：秒（不填默认 300）
            retryCount: 2         # 失败后重试次数（不填默认 0）
            retryDelay: 10        # 每次重试之间的等待时间，单位：秒
            workDir: "/opt/my-project"  # 命令的工作目录
            env:                  # 额外注入的环境变量
              - "DEPLOY_ENV=production"
              - "DOCKER_HOST=unix:///var/run/docker.sock"

      # 同一个仓库可以配多条规则，按不同事件/分支触发不同操作
      - event: "pull_request"
        branches: []              # 空列表 = 匹配所有分支
        actions:
          - type: "shell"
            command: "echo '收到 PR，运行测试...' && go test ./..."

    # 健康监控：定时 GET 请求你的服务，检查是否正常运行
    healthcheck:
      url: "https://my-project.example.com/health"   # 监控地址
      interval: 30                                    # 检查间隔，单位：秒

  # -------------------------------------------------------------------------
  # 示例 2：最简单的用法 —— 收到任意事件时执行一条命令
  # -------------------------------------------------------------------------
  "zxc7563598/simple-site":
    secret: "another-secret"
    rules:
      - event: "push"
        branches:                # 不指定 branches（或设为空列表），匹配所有分支
        actions:
          - type: "shell"
            command: "bash /home/deploy/update-site.sh"

  # -------------------------------------------------------------------------
  # 示例 3：按事件类型执行不同任务（不需要分支匹配）
  # -------------------------------------------------------------------------
  "zxc7563598/blog":
    name: "个人博客"
    secret: "my-blog-secret"
    rules:
      - event: "push"
        branches:
          - main
        actions:
          - type: "shell"
            command: "hugo && rsync -avz public/ /var/www/blog/"

      - event: "release"
        branches: []
        actions:
          - type: "shell"
            command: "echo '新版本发布了！' && curl -X POST https://notify.example.com/release"

    healthcheck:
      url: "https://blog.example.com"
      interval: 60

# ============================================================================
# 完整字段速查表
# ============================================================================
# 顶层：
#   repos: <map>                   仓库配置字典，key = GitHub 仓库全名 (owner/repo)
#
# 每个仓库：
#   repos."owner/repo".name:         展示名称，用于前端仪表盘（可选）
#   repos."owner/repo".secret:       GitHub Webhook Secret，用于签名校验（必填）
#   repos."owner/repo".rules:        触发规则列表（必填，至少一条）
#   repos."owner/repo".healthcheck:  健康监控配置（可选）
#
# 每条规则（rule）：
#   event:    要匹配的 GitHub 事件类型（必填），例如 push、pull_request、release
#   branches: 要匹配的分支名列表；空列表或省略表示匹配所有分支
#   actions:  匹配成功后执行的操作列表
#
# 每个操作（action）：
#   type:       操作类型，当前仅支持 "shell"
#   command:    要执行的 Shell 命令（必填），支持多行（用 YAML 的 | 语法）
#   env:        环境变量列表（可选），格式: ["KEY=VALUE", ...]
#   timeout:    超时时间，秒（可选，默认 300）
#   retryCount: 失败重试次数（可选，默认 0）
#   retryDelay: 重试间隔，秒（可选，默认 0）
#   workDir:    工作目录（可选，默认使用服务的所在目录）
#
# 健康监控（healthcheck）：
#   url:      健康检查地址，服务会定时发送 GET 请求
#            返回 200/301/302 视为正常，其他状态码或请求失败视为异常
#   interval: 检查间隔，秒
# ============================================================================
